name: Build VST3 Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          TARGET_DIR=$(dirname $(find . -name CMakeLists.txt | head -n 1))
          echo "Found CMakeLists.txt in: $TARGET_DIR"
          cmake -S "$TARGET_DIR" -B build -DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Build Plugin
        run: cmake --build build --config Release --parallel

      - name: Upload Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: MultibandHarmonizer-Windows-VST3
          path: build/MultibandHarmonizer_artefacts/Release/VST3/

      - name: Upload Artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: MultibandHarmonizer-macOS-VST3
          path: build/MultibandHarmonizer_artefacts/Release/VST3/
